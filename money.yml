apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-bank-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-bank-app
  template:
    metadata:
      labels:
        app: java-bank-app
    spec:
      containers:
        - name: java-bank-container
          image: naveennallamsetti/java-bank-application-project:latest
          ports:
            - containerPort: 8085

---
apiVersion: v1
kind: Service
metadata:
  name: java-bank-service
spec:
  type: ClusterIP
  selector:
    app: java-bank-app
  ports:
    - port: 80
      targetPort: 8085

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: java-bank-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: "java-bank-app.example.com"   # use a real or test DNS
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: java-bank-service
                port:
                  number: 80
