apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-bank-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-bank-app
  template:
    metadata:
      labels:
        app: java-bank-app
    spec:
      containers:
        - name: java-bank-container
          image: naveennallamsetti/java-bank-application-project:latest
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: java-bank-service
spec:
  type: ClusterIP
  selector:
    app: java-bank-app
  ports:
    - port: 80
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: java-bank-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: java-bank-service
                port:
                  number: 80
